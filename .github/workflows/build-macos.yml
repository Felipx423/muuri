name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [feat/macos-support]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: arm64
          cache: pip
          cache-dependency-path: packaging/requirements-macos.txt
      - name: Instalar dependências de build
        run: python -m pip install -r packaging/requirements-macos.txt
      - name: Testes compartilhados e Cocoa
        run: python packaging/run_tests.py
      - name: Gerar, verificar e iniciar o aplicativo
        run: python packaging/build_macos.py --dmg
      - uses: actions/upload-artifact@v7
        with:
          name: Muuri-macOS-arm64-teste
          path: dist/macos/
          if-no-files-found: error
          retention-days: 14
