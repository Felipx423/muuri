name: Build and publish Muuri release

on:
  push:
    tags: ["muuri-v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências e Inno Setup
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.22.3
          choco install innosetup --no-progress -y
      - name: Testes Windows
        run: python packaging/run_tests.py
      - name: Compilar aplicativo, fontes e instalador
        shell: pwsh
        run: |
          python packaging/build_windows.py
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\muuri.iss
          $output = Join-Path (Split-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) -Parent) "outputs"
          $stage = Join-Path $env:GITHUB_WORKSPACE "release-assets\windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $output "Muuri-Setup.exe") $stage
          Copy-Item (Join-Path $output "Muuri-codigo-fonte.zip") $stage
          Copy-Item (Join-Path $output "COMO-INSTALAR-MUURI.txt") $stage
          $hash = (Get-FileHash (Join-Path $stage "Muuri-Setup.exe") -Algorithm SHA256).Hash.ToLower()
          "$hash  Muuri-Setup.exe" | Set-Content (Join-Path $stage "MUURI-SHA256.txt") -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: muuri-windows-release
          path: release-assets/windows/
          if-no-files-found: error
          retention-days: 3

  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: arm64
          cache: pip
          cache-dependency-path: packaging/requirements-macos.txt
      - name: Instalar dependências de build
        run: python -m pip install -r packaging/requirements-macos.txt
      - name: Testes macOS e Cocoa
        run: python packaging/run_tests.py
      - name: Compilar, verificar e testar app e DMG
        run: python packaging/build_macos.py --dmg
      - uses: actions/upload-artifact@v7
        with:
          name: muuri-macos-release
          path: dist/macos/
          if-no-files-found: error
          retention-days: 3

  publish:
    runs-on: ubuntu-latest
    needs: [windows, macos]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: muuri-windows-release
          path: release-assets/windows
      - uses: actions/download-artifact@v7
        with:
          name: muuri-macos-release
          path: release-assets/macos
      - name: Verificar artefatos da release
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "muuri-v1.4.4"
          test -s release-assets/windows/Muuri-Setup.exe
          test -s release-assets/windows/MUURI-SHA256.txt
          test -s release-assets/macos/Muuri-macOS-arm64.dmg
          test -s release-assets/macos/MUURI-macOS-SHA256.txt
          grep -Eq '^[0-9a-fA-F]{64}[[:space:]]+\*?Muuri-Setup\.exe$' release-assets/windows/MUURI-SHA256.txt
          grep -Eq '^[0-9a-fA-F]{64}[[:space:]]+\*?Muuri-macOS-arm64\.dmg$' release-assets/macos/MUURI-macOS-SHA256.txt
          windows_hash="$(sha256sum release-assets/windows/Muuri-Setup.exe | awk '{print tolower($1)}')"
          macos_hash="$(sha256sum release-assets/macos/Muuri-macOS-arm64.dmg | awk '{print tolower($1)}')"
          grep -Eiq "^${windows_hash}[[:space:]]+\*?Muuri-Setup\.exe$" release-assets/windows/MUURI-SHA256.txt
          grep -Eiq "^${macos_hash}[[:space:]]+\*?Muuri-macOS-arm64\.dmg$" release-assets/macos/MUURI-macOS-SHA256.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Muuri 1.4.4 — Muuri Liso e atualizações confiáveis
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-assets/windows/*
            release-assets/macos/*
          body: |
            O Muuri Liso foi recriado a partir da referência canônica, com sete animações, contornos novos e transparência suave. Escolha Muuri → Liso → Aplicar no painel. O tamanho Original continua com 128 px e o estilo Pixelado permanece disponível. Corrigida a troca involuntária para o estilo pixelado durante o descanso.

            Muuri 1.4.4 melhora o atualizador: o Windows confirma a instalação e verifica a versão instalada, enquanto o macOS baixa e abre o DMG verificado para substituição pelo Finder. A publicação valida os quatro artefatos antes de marcar a release como latest.

            Esta publicação inclui instalador Windows x64 e aplicativo macOS Apple Silicon (M1 ou posterior, macOS 13+). O aplicativo Mac ainda não é notarizado pela Apple; consulte `packaging/MACOS.md` no código-fonte para as instruções de primeira abertura.
